[package]
name = "llm-wiki-server"
version = "0.4.3"
edition = "2021"
description = "LLM Wiki HTTP server — intranet web deployment"

[features]
default = []

[[bin]]
name = "llm-wiki-server"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# File parsing (same versions as Tauri binary)
calamine = "0.34.0"
docx-rs = "0.4.20"
zip = "2"

# PDF (pdfium — requires native lib on Linux, see docs)
# Disabled by default, enable with: --features pdf
# pdfium-render = { version = "0.9", optional = true }

# Vector store
lancedb = "0.27.2"
arrow-array = "57"
arrow-schema = "57"
futures = "0.3"

# Utilities
chrono = { version = "0.4", features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
openssl = { version = "0.10", features = ["vendored"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "unwind"
