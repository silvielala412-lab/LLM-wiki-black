version: "3.8"

services:
  llm-wiki:
    image: llm-wiki:latest
    container_name: llm-wiki
    restart: unless-stopped
    ports:
      - "8231:8231"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Wiki 数据持久化目录 — 请定期备份此目录
      - ./wiki-data:/data:Z
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8231"
      WIKI_DATA_PATH: "/data"
      STATIC_DIR: "/app/dist"
      INGEST_WORKER_PATH: "/app/worker/ingest-worker.js"
      INGEST_WORKER_CONCURRENCY: "${INGEST_WORKER_CONCURRENCY:-2}"
      RUST_LOG: "info"

      # ── 主 LLM（必填）────────────────────────────────────────
      LLM_ENDPOINT: ""          # e.g. http://192.168.x.x:8080/v1
      LLM_API_KEY: ""           # LLM 服务的 API Key
      LLM_MODEL: ""             # e.g. deepseek-chat / qwen2.5-72b
      LLM_API_MODE: "chat_completions"
      LLM_MAX_CONTEXT: ""       # 留空使用模型默认值

      # ── Embedding 向量模型（可选，启用语义搜索）───────────────
      EMBEDDING_ENDPOINT: "http://host.docker.internal:11435/v1/embeddings"
      EMBEDDING_MODEL: "paraphrase-multilingual-MiniLM-L12-v2"

      # ── 内网 PDF OCR API（可选，处理扫描件 PDF）──────────────
      # 接口：POST multipart { user_text, action_scenario, file }
      # 响应：{ "code": 0, "data": { "robot_text": "..." } }
      OCR_ENDPOINT: ""          # e.g. http://192.168.x.x:8088/api/pdf/ocr
      OCR_USER_TEXT: "识别文件中的所有文字"
      OCR_ACTION_SCENARIO: "111"

      # ── 其他 ──────────────────────────────────────────────────
      PDF_DPI: "150"            # 扫描件转图分辨率，密集表格可用 200
      SERVER_CONFIG_LOCKED: "false"  # true=禁止用户在前端修改配置

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8231/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    # 日志轮转 — 防止长期运行后磁盘撑满
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
